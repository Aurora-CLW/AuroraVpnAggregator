name: Update & Deploy

on:
  # schedule 已临时关闭（避免 run 堆积）；需要恢复时取消下一行注释
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'data/sources/**'
      - 'scripts/**'
      - 'src/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoIP database
        run: |
          mkdir -p data/cache
          # 尝试多个源: jsDelivr CDN -> GitHub release -> 直接 raw
          curl -fsSL -o data/cache/GeoLite2-City.mmdb \
            "https://cdn.jsdelivr.net/gh/P3TERX/GeoLite2@release/GeoLite2-City.mmdb" 2>/dev/null || \
          curl -fsSL -o data/cache/GeoLite2-City.mmdb \
            "https://github.com/P3TERX/GeoLite2/releases/download/release/GeoLite2-City.mmdb" 2>/dev/null || \
          curl -fsSL -o data/cache/GeoLite2-City.mmdb \
            "https://raw.githubusercontent.com/P3TERX/GeoLite2/release/GeoLite2-City.mmdb" 2>/dev/null || true
          # 验证文件大小 (正常 >50MB, LFS 指针 <1MB)
          SIZE=$(stat -c%s data/cache/GeoLite2-City.mmdb 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 10485760 ]; then
            echo "GeoLite2 mmdb 不可用 (${SIZE} 字节), 将使用在线 GeoIP API 回退"
            rm -f data/cache/GeoLite2-City.mmdb
          else
            echo "GeoIP 数据库: $SIZE 字节"
          fi
        continue-on-error: true

      - name: Clean public docs
        run: |
          rm -f docs/clash.yaml docs/v2ray.txt docs/singbox.json docs/nodes.json docs/stats.json
          rm -rf docs/s

      - name: Run aggregator
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AURORA_TOKEN: ${{ secrets.AURORA_TOKEN }}
          AURORA_GH_TOKEN: ${{ secrets.AURORA_GH_TOKEN }}
          HF_TG_PARSER_KEY: ${{ secrets.HF_TG_PARSER_KEY }}
        run: python scripts/run.py --no-test

      - name: Verify output
        run: |
          echo "=== docs 目录结构 ==="
          find docs -type f | head -20
          echo "=== 安全检查: 确认根目录无敏感文件 ==="
          test ! -f docs/clash.yaml && echo "✓ 根目录无 clash.yaml"
          test ! -f docs/nodes.json && echo "✓ 根目录无 nodes.json"
          test -f docs/index.html && echo "✓ index.html 存在"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
