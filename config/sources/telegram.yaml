# Telegram 频道订阅源配置
# 无需任何认证！
# 抓取方式 (自动尝试):
#   1. RSS API (tg.i-c-a.su) — 无需认证, GitHub Actions 可用
#   2. Web 翻页 — RSS 无结果时自动翻页抓取历史消息
#   3. Telethon — 需要 api_id/api_hash (可选)
#
# 支持两种消息格式:
#   - 直接节点: 消息含 vmess://, vless:// 等协议链接
#   - 订阅链接: 消息含 https:// 订阅 URL, 自动递归 fetch 并解析
#   - 置顶消息: 配置 pinned_url 直接抓取指定消息 (也可从 RSS 消息中的链接自动发现)
#   - 消息链接: RSS 中的"点我传送"等超链接自动跟踪抓取
#   - 已知订阅: 配置 sub_urls 直接指定已知订阅链接 (频道消息中不易提取时使用)
#
# format 字段 (可选):
#   auto (默认) — 自动检测
#   base64 — Base64 编码
#   clash — Clash YAML
#   singbox — Sing-box JSON
#   urls — 原始 URL 列表
#   用于指定频道消息中订阅链接/文件的解析格式

type: telegram
enabled: true
mode: web

# 每个频道至少收集的有效消息数 (含节点或订阅链接的消息)
# RSS/Web 翻页/HF API 会持续抓取直到达到该数量
min_valid: 50
# Web 预览页翻页最大页数 (每页约 20 条消息)
max_web_pages: 6
# 频道级并发抓取数 (限制并发避免 RSS API 限流)
max_concurrent_channels: 3
# 单个频道内订阅链接 fetch 并发数
max_concurrent_subs: 5
# RSS 响应缓存有效期 (秒), 减少重复请求降低限流触发率
rss_cache_ttl: 1800
# 额外排除的域名 (机场推广/纯广告域名, 检测到节点后仍算有效订阅则不要加)
exclude_domains:
  - "matcha.ltd"
  - "kuaivpn.app"
  - "louwangzhiyu.org"
  - "52pokemon66.cc"

# Telethon 模式配置 (可选, RSS 和 Web 模式不需要)
api_id: ${TELEGRAM_API_ID}
api_hash: ${TELEGRAM_API_HASH}

channels:
  - name: "FreeV2rays"
    username: "@freev2rays"
    enabled: true

  # ProxyShareCN — 每条消息含订阅 URL, 自动递归解析
  - name: "ProxyShareCN"
    username: "@proxyshareCN"
    enabled: true

  # CrackHubCN — "点我传送"链接指向置顶消息, 自动从 RSS 发现并抓取
  - name: "CrackHubCN"
    username: "@crackhub_cn"
    enabled: true

  # FreeVPNjd — RSS 间歇性限流, Web 翻页可获取
  - name: "FreeVPNjd"
    username: "@freeVPNjd"
    enabled: true

  # go4sharing — 消息中含超链接指向订阅页面, 自动跟踪
  - name: "go4sharing"
    username: "@go4sharing"
    enabled: true

  # freeyule — 免费娱乐资源频道 (订阅链接 shz.al/rGdD 已失效, 暂时停用)
  - name: "FreeYule"
    username: "@freeyule"
    sub_urls:
      - "https://shz.al/rGdD"
    enabled: false

  # wxdy666 — 每日更新大量直接节点 (vless/vmess/ss)
  - name: "Wxdy666"
    username: "@wxdy666"
    enabled: true

  # V2Queen — 频道消息含 v2clash.blog 日期, 自动构造订阅 URL
  - name: "V2Queen"
    username: "@v2queen"
    website_url: "https://proxyqueen.top"
    v2clash: true
    enabled: true

  # DingyueJiedian8 — 订阅节点频道, 消息含 https:// 订阅链接
  - name: "DingyueJiedian8"
    username: "@DingyueJiedian8"
    enabled: true

  # fqzw9 — 免费翻转资源
  - name: "fqzw9"
    username: "@fqzw9"
    enabled: true

  # xhjvpn — VPN 节点分享
  - name: "xhjvpn"
    username: "@xhjvpn"
    enabled: true

  # hanbaoyun666 — VPN 节点分享 (多次测试确认: 最近消息纯广告/机场推广, 无节点, 已停用)
  - name: "hanbaoyun666"
    username: "@hanbaoyun666"
    enabled: false

  # ZDYZ2Y — VPN 节点分享 (多次测试确认: 最近消息纯广告/超搜推广, 无节点, 已停用)
  - name: "ZDYZ2Y"
    username: "@ZDYZ2Y"
    enabled: false

  # changfengchannel — VPN 节点分享
  - name: "changfengchannel"
    username: "@changfengchannel"
    enabled: true

  # jiedian168 — 文件中包含节点 (订阅链接 tgz.heidong.cyou 已失效, 暂时停用)
  - name: "jiedian168"
    username: "@jiedian168"
    enabled: false

  # fq521 — VPN 节点分享
  - name: "fq521"
    username: "@fq521"
    enabled: true

  # fq5211 — VPN 节点分享
  - name: "fq5211"
    username: "@fq5211"
    enabled: true

  # jiedian678 — VPN 节点分享
  - name: "jiedian678"
    username: "@jiedian678"
    enabled: true

  # xlyv2ray — VPN 节点分享
  - name: "xlyv2ray"
    username: "@xlyv2ray"
    enabled: true

  # 可添加更多频道
  # - name: "MyChannel"
  #   username: "@my_channel"
